<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse manga series on MangaGoRaw."><link rel="canonical" href="https://mangagoraw.github.io/manga.html"><title>Manga Index | MangaGoRaw</title><style>:root{color-scheme:dark;--bg:#07090e;--panel:#0d1119;--line:#202a39;--muted:#8d98aa;--text:#f5f7fb;--accent:#79a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 450px at 80% 0,#182a49,transparent 60%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#090c12e8;backdrop-filter:blur(14px)}.brand{font-size:24px;font-weight:900}.brand span{color:var(--accent)}.links{display:flex;gap:20px;color:#aab3c2;font-size:14px}.wrap{max-width:1200px;margin:auto;padding:55px 5% 70px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--accent)}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.05em;line-height:1;margin:12px 0}.lead{color:#aeb7c6;max-width:760px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:35px}.card{min-height:185px;padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#121925,#0b0f16);display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;transition:.18s transform,.18s border-color}.card:before{content:"";position:absolute;width:180px;height:180px;right:-50px;top:-60px;border-radius:50%;background:#1d3358;opacity:.45}.card>*{position:relative}.card:hover{transform:translateY(-3px);border-color:#3a5c8e}.name{font-size:21px;font-weight:900}.native{color:#9aa6b8;margin-top:5px}.country{color:#6f87a8;font-size:12px;margin-top:9px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav{height:auto;padding:16px 5%}.links{gap:12px;flex-wrap:wrap;justify-content:flex-end}}</style></head><body><nav class="nav"><a class="brand" href="/"><span>Manga</span>GoRaw</a><div class="links"><a href="/">Home</a><a href="/latest-chapters.html">Latest</a><a href="/admin/">Admin</a></div></nav><main class="wrap"><div class="eyebrow">SERIES DIRECTORY</div><h1>Manga</h1><p class="lead">Explore the series represented in the current MangaGoRaw release metadata.</p><div id="grid" class="grid"></div></main><script>const grid=document.getElementById('grid');function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}fetch('/data/content.json').then(r=>r.json()).then(d=>{const a=d.mangas||d.series||[];grid.innerHTML=a.map(m=>`<a class="card" href="/latest-chapters.html"><span class="name">${e(m.title||m.name)}</span><span class="native">${e(m.native_title||m.nativeTitle||'')}</span><span class="country">${e(m.country||'Manga series')}</span></a>`).join('')||'<div>No manga records found.</div>'}).catch(()=>grid.innerHTML='<div>Unable to load manga records.</div>');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest manga chapter metadata on MangaGoRaw"><link rel="canonical" href="https://mangagoraw.github.io/latest-chapters.html"><title>Latest Chapters | MangaGoRaw</title><style>body{margin:0;background:#08090d;color:#eee;font:16px system-ui,sans-serif}header{padding:20px 5%;border-bottom:1px solid #252a35;background:#0b0c11}main{max-width:1100px;margin:auto;padding:35px 5%}a{color:inherit;text-decoration:none}.card{display:block;padding:18px;margin:10px 0;border:1px solid #2b3547;border-radius:14px;background:#10151f}.card:hover{border-color:#5b8bd9}.muted{color:#929aaa}</style></head><body><header><a href="/">← MangaGoRaw</a></header><main><h1>Latest Chapters</h1><p class="muted">Recent chapter records.</p><div id="list">Loading…</div></main><script>Promise.all(['/data/manual-chapters.json','/data/extra-chapters.json'].map(u=>fetch(u).then(r=>r.json()))).then(ds=>{let a=ds.flatMap(d=>d.chapters||[]).sort((x,y)=>(+y.number||0)-(+x.number||0));list.innerHTML=a.map(c=>`<a class="card" href="/chapter.html?slug=${encodeURIComponent(c.slug)}"><strong>${e(c.title)}</strong><div class="muted">${e(c.mangaId)} · Chapter ${e(c.number)}</div></a>`).join('')});function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>

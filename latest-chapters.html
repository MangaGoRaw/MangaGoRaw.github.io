c?.slug&&!seen.has(String(c.slug).toLowerCase())){seen.add(String(c.slug).toLowerCase());rows.push(c)}})});render()}).catch(()=>list.innerHTML='<div class="empty">Unable to load chapters.</div>');function render(){let a=rows.filter(c=>{const t=String(c.title||'').toLowerCase(),m=String(c.mangaId||c.mangaTitle||c.manga||'').toLowerCase(),s=String(c.slug||'').toLowerCase(),x=q.value.trim().toLowerCase();return !x||t.includes(x)||m.includes(x)||s.includes(x)});if(sort.value==='old')a.sort((x,y)=>time(x)-time(y));else if(sort.value==='num')a.sort((x,y)=>(Number(y.number)||0)-(Number(x.number)||0));else a.sort((x,y)=>time(y)-time(x)||(Number(y.number)||0)-(Number(x.number)||0));list.innerHTML=a.map(c=>'<a class="card" href="/chapter.html?slug='+encodeURIComponent(c.slug)+'"><div class="manga">'+e(c.mangaTitle||c.manga||c.mangaId||'Manga')+'</div><div class="title">'+e(c.title||'Chapter '+(c.number??''))+'</div><div class="meta">Chapter '+e(c.number??'')+' · Open →</div></a>').join('')||'<div class="empty">No chapters found.</div>}q.oninput=render;sort.onchange=render;</script></body></html>

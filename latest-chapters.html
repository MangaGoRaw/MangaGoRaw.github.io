<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Latest manga chapter records on MangaGoRaw."><link rel="canonical" href="https://mangagoraw.github.io/latest-chapters.html"><title>Latest Chapters | MangaGoRaw</title><style>:root{color-scheme:dark;--bg:#07090e;--panel:#0d1119;--line:#202a39;--muted:#8d98aa;--text:#f5f7fb;--accent:#79a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 400px at 80% 0,#182a49,transparent 60%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#090c12e8;backdrop-filter:blur(14px);position:sticky;top:0}.brand{font-size:24px;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--accent)}.links{display:flex;gap:20px;color:#aab3c2;font-size:14px}.wrap{max-width:1200px;margin:auto;padding:55px 5% 70px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--accent)}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.05em;line-height:1;margin:12px 0}.lead{color:#aeb7c6;max-width:760px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:35px}.card{padding:20px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,#111722,#0b0f16);transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-2px);border-color:#3a5c8e}.manga{color:#8f9db1;font-size:12px}.title{font-size:18px;font-weight:850;margin-top:5px}.meta{color:#9fc2ff;font-weight:800;font-size:12px;margin-top:8px}.empty{padding:25px;border:1px dashed #334057;border-radius:14px;color:var(--muted)}@media(max-width:700px){.list{grid-template-columns:1fr}.nav{height:auto;padding:16px 5%}.links{gap:12px;flex-wrap:wrap;justify-content:flex-end}}</style></head><body><nav class="nav"><a class="brand" href="/"><span>Manga</span>GoRaw</a><div class="links"><a href="/">Home</a><a href="/manga.html">Manga</a><a href="/admin/">Admin</a></div></nav><main class="wrap"><div class="eyebrow">RELEASE DIRECTORY</div><h1>Latest Chapters</h1><p class="lead">Browse the newest chapter records in one clean, mobile-friendly directory.</p><div id="list" class="list"><div class="empty">Loading chapters…</div></div></main><script>const list=document.getElementById('list');function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}Promise.all(['/data/manual-chapters.json','/data/extra-chapters.json'].map(u=>fetch(u).then(r=>r.json()))).then(ds=>{const a=ds.flatMap(d=>d.chapters||[]).sort((x,y)=>(+y.number||0)-(+x.number||0));list.innerHTML=a.map(c=>`<a class="card" href="/chapter.html?slug=${encodeURIComponent(c.slug)}"><div class="manga">${e(c.mangaId)}</div><div class="title">${e(c.title)}</div><div class="meta">Chapter ${e(c.number)} · Open →</div></a>`).join('')||'<div class="empty">No chapters found.</div>'}).catch(()=>list.innerHTML='<div class="empty">Unable to load chapters.</div>');</script></body></html>

name: Deploy MangaGoRaw to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: python3 .github/build_pages.py

      - name: Apply site verification and analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          dist = Path('dist')
          ga_id = 'G-HC32QHLNXB'
          verification = 'IKaTiLHBDaKfdoCrKcZKlAQV1WLKUmYJxjK6uVFr8MM'
          # analytics.js is generated by .github/build_pages.py. Do not overwrite it here:
          # that build contains the single-pageview logic needed for chapter titles.
          if not (dist / 'analytics.js').exists():
              raise SystemExit('analytics.js was not generated by the build step')
          for p in dist.rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              # Remove legacy Google Analytics / Tag Manager snippets and duplicate verification tags.
              text = re.sub(r'<script[^>]+googletagmanager\.com/gtag/js[^>]*></script>', '', text, flags=re.I)
              text = re.sub(r'<script[^>]*>[^<]*(?:gtag|GoogleAnalyticsObject|google-analytics)[\s\S]*?</script>', '', text, flags=re.I)
              # The homepage feed is rendered statically during the build. Remove the
              # legacy runtime renderer so it cannot replace the populated feed with an empty state.
              text = re.sub(r'<script[^>]+src=["\']/homepage-system\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', text, flags=re.I)
              text = re.sub(r'<meta[^>]+name=["\']google-site-verification["\'][^>]*>', '', text, flags=re.I)
              verification_tag = f'<meta name="google-site-verification" content="{verification}">'
              text = text.replace('</head>', verification_tag + '</head>', 1) if p.name == 'index.html' else text
              if not re.search(r'<script[^>]+src=["\']/analytics\.js(?:\?[^"\']*)?["\'][^>]*></script>', text, flags=re.I):
                  text = text.replace('</head>', '<script src="/analytics.js?v=1"></script></head>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify chapter image pipeline
        shell: python
        run: |
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          dist=Path("dist")
          sources=["data/content.json","data/manual-chapters.json","data/upcoming-chapters.json","data/extra-chapters.json"]
          by_slug={}
          for name in sources:
              p=dist/name
              if not p.exists(): continue
              data=json.loads(p.read_text(encoding="utf-8"))
              for c in data.get("chapters",[]):
                  slug=str(c.get("slug") or "").strip().lower()
                  if not slug: continue
                  pages=c.get("pages") or []
                  old=by_slug.get(slug,{})
                  if len(pages)>len(old.get("pages") or []): by_slug[slug]=c
          published=0
          for slug,c in by_slug.items():
              pages=c.get("pages") or []
              if not pages: continue
              published+=1
              for page in pages:
                  value=page if isinstance(page,str) else (page.get("path") or page.get("url") or page.get("src") or "")
                  value=str(value)
                  raw="https://raw.githubusercontent.com/MangaGoRaw/MangaGoRaw.github.io/main/"
                  if value.startswith(raw): value=value[len(raw):]
                  elif value.startswith("https://mangagoraw.github.io/"): value=value[len("https://mangagoraw.github.io/"):]
                  value=value.lstrip("/")
                  if not (dist/value).is_file(): raise SystemExit(f"Missing chapter image for {slug}: {value}")
          if published < 1: raise SystemExit("No chapter with attached images was found in build data")
          chapter_html=(dist/"chapter.html").read_text(encoding="utf-8")
          if "data/manual-chapters.json" not in chapter_html: raise SystemExit("chapter.html is not wired to manual chapter data")
          print(f"Verified {published} image-backed chapter(s) and all referenced image files.")

      - name: Verify homepage build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('dist/index.html')
          text = p.read_text(encoding='utf-8')
          cards = len(re.findall(r'class=["\']home-card', text))
          if cards < 1:
              raise SystemExit(f'Homepage verification failed: only {cards} cards found')
          if 'homepage-system.js' in text:
              raise SystemExit('Homepage verification failed: legacy homepage runtime is still loaded')
          print(f'Homepage verified: {cards} cards rendered statically and runtime homepage script removed.')
          PY

      - name: Verify SEO artifacts
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          dist = Path('dist')
          robots = (dist/'robots.txt').read_text(encoding='utf-8')
          sitemap = (dist/'sitemap.xml').read_text(encoding='utf-8')
          if 'Sitemap: https://mangagoraw.github.io/sitemap.xml' not in robots:
              raise SystemExit('SEO verification failed: robots.txt sitemap declaration is missing')
          manual = json.loads((dist/'data/manual-chapters.json').read_text(encoding='utf-8'))
          expected = {str(c.get('slug')).strip() for c in manual.get('chapters',[]) if c.get('slug') and c.get('pages')}
          found = set(re.findall(r'https://mangagoraw\.github\.io/chapter\.html\?slug=([^<]+)', sitemap))
          from urllib.parse import unquote
          found = {unquote(x) for x in found}
          missing = sorted(expected - found)
          if missing:
              raise SystemExit('SEO verification failed: sitemap missing image-backed chapter URL(s): ' + ', '.join(missing))
          if '%20' in sitemap:
              raise SystemExit('SEO verification failed: malformed encoded-space URL found in sitemap')
          print(f'SEO verified: {len(found)} chapter URL(s) represented in sitemap; robots.txt points to sitemap.xml.')
          PY

      - name: Verify analytics and ads wiring
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          dist=Path('dist')
          cfg=json.loads((dist/'data/ads-config.json').read_text(encoding='utf-8'))
          enabled=[s for s in cfg.get('sections',[]) if s.get('enabled') and str(s.get('code') or '').strip()]
          if not enabled:
              raise SystemExit('Ads verification failed: no enabled ad sections in data/ads-config.json')
          ads=(dist/'ads.js').read_text(encoding='utf-8')
          if 'execCode(' not in ads or 'mounted={}' not in ads:
              raise SystemExit('Ads verification failed: ad renderer is missing')
          pages=['index.html','latest-chapters.html','manga.html','chapter.html']
          for name in pages:
              p=dist/name
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              ga=len(re.findall(r'<script[^>]+src=["\']/analytics\.js(?:\?[^"\']*)?["\'][^>]*></script>',text,re.I))
              ad=len(re.findall(r'<script[^>]+src=["\']/ads\.js(?:\?[^"\']*)?["\'][^>]*></script>',text,re.I))
              if ga != 1: raise SystemExit(f'Analytics verification failed in {name}: expected 1 analytics.js tag, found {ga}')
              if ad != 1: raise SystemExit(f'Ads verification failed in {name}: expected 1 ads.js tag, found {ad}')
          print(f'Analytics/ads verified: {len(enabled)} enabled ad sections and one renderer tag on each public page.')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

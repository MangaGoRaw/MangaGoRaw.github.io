<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><meta name="google-site-verification" content="IKaTiLHBDaKfdoCrKcZKlAQV1WLKUmYJxjK6uVFr8MM"><meta name="description" content="MangaGoRaw — latest manga chapters and raw releases."><link rel="canonical" href="https://mangagoraw.github.io/"><title>MangaGoRaw — Latest Manga Chapters & Raw Releases</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:20px;color:#aeb3c0;font-size:14px}.navlinks .archive{color:#fff;font-weight:800}.hero{padding:55px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{font-size:clamp(40px,6vw,70px);margin:0 0 14px}.hero p{max-width:760px;color:#b8bbc6;font-size:17px;line-height:1.6}.section{max-width:1380px;margin:auto;padding:30px 5%}.home-static{max-width:1380px;margin:0 auto;padding:30px 5% 50px}.home-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.home-head span{font-size:11px;letter-spacing:.14em;font-weight:900;color:#7da8ef}.home-head h2{font-size:28px;margin:5px 0}.home-head p{margin:0;color:#8f97a8;font-size:13px}.home-head a{color:#9fc2ff;font-size:13px;font-weight:800}.home-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.home-card{position:relative;display:block;min-height:245px;border-radius:14px;overflow:hidden;background:#10151f;border:1px solid #2b3547}.home-card img{width:100%;height:245px;display:block;object-fit:cover}.home-card.featured{grid-column:span 2}.home-card.featured img{height:320px}.home-overlay{position:absolute;left:0;right:0;bottom:0;padding:40px 13px 13px;background:linear-gradient(transparent,rgba(5,7,12,.96))}.home-overlay small{display:block;color:#b9c0cc;font-size:10px}.home-overlay strong{display:block;font-size:15px;margin-top:5px;line-height:1.3}.home-overlay b{display:block;font-size:11px;color:#9fc2ff;margin-top:5px}.home-list{margin-top:28px;border-top:1px solid #252c39}.home-list a{display:flex;justify-content:space-between;padding:15px 8px;border-bottom:1px solid #252c39}.home-list strong{font-size:14px}.home-list span{display:block;color:#8f97a8;font-size:12px;margin-top:4px}.home-list b{color:#7da8ef;font-size:12px}@media(max-width:1050px){.home-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.home-grid{grid-template-columns:repeat(2,1fr)}.home-card.featured{grid-column:span 2}.home-card,.home-card.featured,.home-card img,.home-card.featured img{min-height:220px;height:220px}}</style><script src="/analytics.js"></script></head><body><nav class="nav"><a class="brand" href="/"><span>Manga</span>GoRaw</a><div class="navlinks"><a class="archive" href="/latest-chapters.html">Latest Chapters</a><a href="/manga.html">Manga</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Discover manga beyond borders.</h1><p>Latest manga chapters, raw releases, and new updates — all in one place.</p></header><main id="app" class="section"><section class="home-static"><div class="home-head"><div><span>LATEST RELEASES</span><h2>Latest Chapters</h2><p>Newest posted or updated chapters.</p></div><a href="/latest-chapters.html">View all →</a></div><div id="home-grid" class="home-grid"><div class="home-card featured"><div class="home-overlay"><strong>Loading latest chapters…</strong></div></div></div><div id="home-list" class="home-list"></div></section></main><script>
(function(){
'use strict';
const grid=document.getElementById('home-grid'), list=document.getElementById('home-list');
const esc=s=>String(s??'').replace(/[&<>\\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#039;'}[m]));
const time=c=>{for(const k of ['updated_at','updatedAt','published_at','publishedAt','created_at','createdAt']){const n=Date.parse(c?.[k]);if(Number.isFinite(n))return n}return 0};
const unwrap=d=>d&&typeof d.content==='string'?(()=>{try{return JSON.parse(d.content)}catch(e){return d}})():d||{};
const coverMap={
'one-piece':'/manga-covers/one-piece/1789667418337-______raw___One_piece_raw__.webp',
'blue-lock':'/manga-covers/blue-lock/1789725186423-________raw___Blue_Lock_Raw__.jpg',
'adults-war':'/manga-covers/adults-war/1789750832316-61AdhOYWu4L.jpg',
'the-fragrant-flowers-bloom-dignifiedly':'/manga-covers/the-fragrant-flowers-bloom-dignifiedly/1789667371729-img_kv2.jpg',
'boku-to-roboko':'/manga-covers/boku-to-roboko/1789667349988-71X9QX_xG5L._UF1000_1000_QL80_.jpg',
'days':'/manga-covers/days/1789667403096-_______.jpg',
'the-four-knights-of-the-apocalypse':'/manga-covers/the-four-knights-of-the-apocalypse/1789725500067-91YKJmha2uL._UF1000_1000_QL80_.jpg'
};
function mangaId(c){return String(c.mangaId||c.manga_id||c.seriesId||c.series_id||'').trim()}
function cover(c){const id=mangaId(c);return coverMap[id]||''}
function render(rows){
 rows.sort((a,b)=>time(b)-time(a)||(Number(b.number)||0)-(Number(a.number)||0));
 const top=rows.slice(0,9);
 grid.innerHTML=top.map((c,i)=>{
   const href='/chapter.html?slug='+encodeURIComponent(c.slug);
   const img=cover(c);
   return '<a class="home-card '+(i===0?'featured':'')+'" href="'+href+'">'+
     (img?'<img src="'+img+'" alt="'+esc(c.mangaTitle||c.manga||c.mangaId||'Manga')+' cover" loading="lazy">':'<div class="ma-home-cover-fallback" aria-hidden="true">M</div>')+
     '<div class="home-overlay"><small>Latest release</small><strong>'+esc(c.mangaTitle||c.manga||c.mangaId||'Manga')+'</strong><b>Chapter '+esc(c.number??'')+'</b></div></a>';
 }).join('');
 list.innerHTML=top.map(c=>'<a href="/chapter.html?slug='+encodeURIComponent(c.slug)+'"><div><strong>'+esc(c.mangaTitle||c.manga||c.mangaId||'Manga')+'</strong><span>'+esc(c.title||('Chapter '+(c.number??'')))+'</span></div><b>Read →</b></a>').join('');
}
Promise.all(['/data/content.json','/data/manual-chapters.json','/data/extra-chapters.json'].map(u=>fetch(u+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}))))
.then(ds=>{
 const seen=new Set(),rows=[];
 ds.forEach(d=>{
   const x=unwrap(d);
   (x.chapters||[]).forEach(c=>{
     const key=String(c.slug||'').toLowerCase();
     if(key&&!seen.has(key)){seen.add(key);rows.push(c)}
   });
 });
 render(rows);
})
.catch(()=>{grid.innerHTML='<div class="home-card featured"><div class="home-overlay"><strong>Unable to load latest chapters.</strong></div></div>';});
})();
</script><script src="/ads.js?v=4"></script></body></html>

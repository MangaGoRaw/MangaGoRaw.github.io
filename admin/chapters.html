<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapters Admin | MangaGoRaw</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#11131a;border:1px solid #292e39;border-radius:12px;padding:16px;margin:14px 0}button,input,select{padding:9px;border-radius:8px;border:1px solid #343a48;background:#090b10;color:#fff;font:inherit}button{background:#3f73c9;font-weight:700;cursor:pointer}.danger{background:#a73535}.secondary{background:#292e39}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#aab0bd;font-size:13px;margin:9px 0 5px}.item{padding:12px;border:1px solid #292e39;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.muted{color:#aab0bd}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.selectbox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}@media(max-width:700px){.row,.selectbox{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/manga.html">📖 Manga</a><a href="/admin/ads.html">📢 Ads</a><a href="/">Open site</a></div><h1>📚 Chapters Admin</h1><div class="panel"><input id="token" type="password" placeholder="GitHub token" style="width:70%"> <button id="connect">Connect</button><button id="logout" class="secondary">Forget token</button><div id="msg" class="muted"></div></div><main id="app" class="hidden"><div class="panel"><div class="selectbox"><div><label>Manga</label><select id="manga"></select></div><button id="add">＋ Add chapter</button></div></div><div class="panel"><input id="search" placeholder="Search chapters" style="width:100%"><p id="stats" class="muted"></p><div id="list"></div></div><div id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><div class="row"><div><label>Chapter number</label><input id="num" type="number" style="width:100%"></div><div><label>Title</label><input id="title" style="width:100%"></div><div><label>Slug</label><input id="slug" style="width:100%"></div><div><label>Manga</label><input id="mangaName" disabled style="width:100%"></div></div><div class="actions"><button id="save">Save chapter</button><button id="delete" class="danger hidden">Delete</button><button id="cancel" class="secondary">Cancel</button></div><hr><label>Chapter images (sorted by filename)</label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"><p id="filesInfo" class="muted"></p><button id="upload">Replace images</button><p id="uploadInfo" class="muted"></p></div></main></div><script>'use strict';const OWNER='MangaGoRaw',REPO='MangaGoRaw.github.io',BRANCH='main',CONTENT='data/content.json',MANUAL='data/manual-chapters.json';let token=sessionStorage.getItem('mangagoraw_github_token')||'',content={mangas:[],chapters:[]},manual={version:1,chapters:[]},current=null,currentManual=true;const $=id=>document.getElementById(id);const headers=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'});const sleep=m=>new Promise(r=>setTimeout(r,m));function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function enc(s){const b=new TextEncoder().encode(s);let out='';for(let i=0;i<b.length;i+=32768)out+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(out)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={},tryNo=0){let r,t;try{r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,{...opt,headers:{...headers(),...(opt.headers||{})},cache:'no-store'});t=await r.text()}catch(e){if(tryNo<2){await sleep(700);return api(path,opt,tryNo+1)}throw e}if(!r.ok){if((r.status===409||r.status===429||r.status>=500)&&tryNo<3){await sleep(800*(tryNo+1));return api(path,opt,tryNo+1)}let d=t;try{d=JSON.parse(t).message||t}catch(e){}throw Error('GitHub '+r.status+': '+String(d).slice(0,500))}return t?JSON.parse(t):{}}async function read(path){const x=await api('/contents/'+path+'?ref='+BRANCH);return{data:JSON.parse(dec(x.content)),sha:x.sha}}async function write(path,data,sha,msg){await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:msg,content:enc(JSON.stringify(data,null,2)+'\n'),sha,branch:BRANCH})})}function selected(){return $('manga').value}function selectedManga(){return content.mangas.find(m=>m.id===selected())||{}}function allChapters(){const a=[...(content.chapters||[]).map(c=>({...c,_manual:false}))];for(const c of manual.chapters||[])if(!a.some(x=>x.slug===c.slug))a.push({...c,_manual:true});return a.filter(c=>String(c.mangaId||c.manga_id||c.seriesId||c.series_id)==selected()||String(c.slug||'').toLowerCase().startsWith(String(selectedManga().slug||selected()).toLowerCase()+'-'))}function render(){const ms=content.mangas||[];$('manga').innerHTML=ms.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+'</option>').join('');const a=allChapters().sort((x,y)=>(Number(y.number)||0)-(Number(x.number)||0));const q=$('search').value.trim().toLowerCase();const shown=a.filter(c=>!q||[c.title,c.slug,c.number].join(' ').toLowerCase().includes(q));$('stats').textContent=shown.length+' chapters';$('list').innerHTML=shown.map(c=>'<div class="item"><div><b>'+esc(c.title||('Chapter '+c.number))+'</b><br><span class="muted">Chapter '+esc(c.number)+' · '+esc(c.slug)+' · '+(c.pages?.length||0)+' pages'+(c._manual?' · Manual':'')+'</span></div><div class="actions"><button onclick="editChapter('+JSON.stringify(c.slug)+','+c._manual+')">Edit</button><button class="danger" onclick="removeChapter('+JSON.stringify(c.slug)+','+c._manual+')">Delete</button></div></div>').join('')||'<p class="muted">No chapters for this manga.</p>'}function reset(){current=null;currentManual=true;$('heading').textContent='Add chapter';$('num').value='';$('title').value='';$('slug').value=(selectedManga().slug||selected())+'-raw-';$('mangaName').value=selectedManga().title||'';$('files').value='';$('filesInfo').textContent='';$('uploadInfo').textContent='';$('delete').classList.add('hidden');$('editor').classList.remove('hidden')}window.editChapter=(slug,isManual)=>{const src=isManual?manual.chapters:content.chapters,c=src.find(x=>x.slug===slug);if(!c)return;current={...c};currentManual=isManual;$('heading').textContent='Edit chapter';$('num').value=c.number||'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('mangaName').value=selectedManga().title||'';$('delete').classList.remove('hidden');$('editor').classList.remove('hidden');window.scrollTo({top:$('editor').offsetTop-20,behavior:'smooth'})};async function save(){const m=selectedManga(),num=Number($('num').value),title=$('title').value.trim(),slug=$('slug').value.trim();if(!m.id)throw Error('Select a manga.');if(!num||!title||!slug)throw Error('Chapter number, title and slug are required.');const now=new Date().toISOString();const x=await read(currentManual?MANUAL:CONTENT),arr=x.data.chapters||[];if(current){const c=arr.find(z=>z.id===current.id||z.slug===current.slug);if(!c)throw Error('Chapter record not found.');Object.assign(c,{mangaId:m.id,number:num,title,slug,country:'JP',pages:Array.isArray(c.pages)?c.pages:[],updatedAt:now,updated_at:now})}else{if((content.chapters||[]).some(c=>c.slug===slug)||(manual.chapters||[]).some(c=>c.slug===slug))throw Error('Duplicate chapter slug.');arr.push({id:'manual-'+Date.now(),mangaId:m.id,number:num,title,slug,country:'JP',pages:[],createdAt:now,updatedAt:now})}await write(currentManual?MANUAL:CONTENT,x.data,x.sha,(current?'Update ':'Add ')+slug);await load();current=manual.chapters.find(c=>c.slug===slug)||null;currentManual=true;$('editor').classList.add('hidden');$('msg').textContent='✓ Chapter saved.'}async function removeChapter(slug,isManual){if(!confirm('Delete '+slug+' and its image files?'))return;try{const x=await read(isManual?MANUAL:CONTENT),c=(x.data.chapters||[]).find(z=>z.slug===slug);if(!c)return;const folder='chapter-images/'+(selectedManga().slug||selected())+'/chapter-'+slug;let items=[];try{items=await api('/contents/'+folder+'?ref='+BRANCH)}catch(e){}for(const p of new Set([...(c.pages||[]).map(pathFromPage),...(Array.isArray(items)?items.filter(i=>i.type==='file').map(i=>i.path):[])]))await deletePath(p);x.data.chapters=x.data.chapters.filter(z=>z.slug!==slug);await write(isManual?MANUAL:CONTENT,x.data,x.sha,'Delete '+slug);await load();$('msg').textContent='✓ Chapter deleted.'}catch(e){$('msg').textContent='Delete failed: '+e.message}}window.removeChapter=removeChapter;function pathFromPage(p){return String(p).replace(/^https?:\/\/raw\.githubusercontent\.com\/MangaGoRaw\/MangaGoRaw\.github\.io\/main\//,'').replace(/^https?:\/\/mangagoraw\.github\.io\//,'').replace(/^\//,'')}async function deletePath(path){if(!path)return;try{const x=await api('/contents/'+path+'?ref='+BRANCH);await api('/contents/'+path,{method:'DELETE',body:JSON.stringify({message:'Remove chapter image',sha:x.sha,branch:BRANCH})})}catch(e){if(!String(e.message).includes('GitHub 404'))throw e}}function file64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(Error('Could not read '+f.name));r.readAsDataURL(f)})}async function upload(){if(!current)throw Error('Save the chapter first.');const fs=[...$('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)throw Error('Select images.');const source=await read(currentManual?MANUAL:CONTENT),c=(source.data.chapters||[]).find(z=>z.id===current.id||z.slug===current.slug);if(!c)throw Error('Chapter record not found.');const folder='chapter-images/'+(selectedManga().slug||selected())+'/chapter-'+c.slug,temp=folder+'/.upload-'+Date.now(),paths=[];let uploaded=[];try{for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>24*1024*1024)throw Error(f.name+' exceeds 24 MB.');const path=temp+'/'+String(i+1).padStart(4,'0')+'-'+f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');$('uploadInfo').textContent='Uploading '+(i+1)+'/'+fs.length+' — '+f.name;await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Upload chapter image '+c.slug,content:await file64(f),branch:BRANCH})});paths.push(path);uploaded.push(path)}const latest=await read(currentManual?MANUAL:CONTENT),cc=(latest.data.chapters||[]).find(z=>z.id===c.id||z.slug===c.slug);if(!cc)throw Error('Chapter changed while uploading.');const old=cc.pages||[];cc.pages=paths.map(p=>'/'+p);cc.updatedAt=new Date().toISOString();await write(currentManual?MANUAL:CONTENT,latest.data,latest.sha,'Attach images '+cc.slug);for(const p of old.map(pathFromPage))if(!uploaded.includes(p))await deletePath(p);const items=await api('/contents/'+folder+'?ref='+BRANCH).catch(()=>[]);if(Array.isArray(items))for(const i of items)if(i.type==='file'&&!uploaded.includes(i.path))await deletePath(i.path);await load();current=manual.chapters.find(z=>z.id===cc.id)||null;$('uploadInfo').textContent='✓ '+fs.length+' images uploaded and attached.'}catch(e){$('uploadInfo').textContent='Upload failed; existing pages were kept. '+e.message;for(const p of uploaded)await deletePath(p).catch(()=>{});throw e}}async function load(){const [c,m]=await Promise.all([read(CONTENT),read(MANUAL)]);content=c.data;manual=m.data;content.mangas=content.mangas||[];content.chapters=content.chapters||[];manual.chapters=manual.chapters||[];render()}$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;$('connect').disabled=true;try{await api('/contents/'+CONTENT+'?ref='+BRANCH);sessionStorage.setItem('mangagoraw_github_token',token);await load();$('app').classList.remove('hidden');$('msg').textContent='✓ Connected.'}catch(e){$('msg').textContent=e.message}finally{$('connect').disabled=false}};$('logout').onclick=()=>{sessionStorage.removeItem('mangagoraw_github_token');location.reload()};$('manga').onchange=()=>render();$('search').oninput=()=>render();$('add').onclick=reset;$('cancel').onclick=()=>{$('editor').classList.add('hidden')};$('save').onclick=()=>save().catch(e=>$('msg').textContent='Error: '+e.message);$('delete').onclick=()=>current&&removeChapter(current.slug,currentManual);$('upload').onclick=()=>upload().catch(()=>{});$('files').onchange=()=>{$('filesInfo').textContent=$('files').files.length+' images selected'};if(token){$('token').value=token;$('connect').click()}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ads System | MangaGoRaw</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#11131a;border:1px solid #292e39;border-radius:12px;padding:16px;margin:14px 0}.ad{border:1px solid #303644;border-radius:10px;padding:14px;margin:12px 0;background:#0c0f15}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#aab0bd;font-size:13px;margin:9px 0 5px}input,select,textarea,button{font:inherit;border:1px solid #343a48;border-radius:8px;background:#090b10;color:#fff;padding:9px}textarea{width:100%;min-height:110px}button{background:#3f73c9;font-weight:700}.secondary{background:#292e39}.muted{color:#aab0bd}.ok{color:#79d49a}.err{color:#ff9a9a}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/manga.html">📖 Manga</a><a href="/">Open site</a></div><h1>📢 Ads System</h1><div id="list"></div><div class="panel"><button id="save">Save all Ads to GitHub</button><button id="reload" class="secondary">Reload</button><p id="msg" class="muted"></p></div></div><script>'use strict';const repo='MangaGoRaw/MangaGoRaw.github.io',path='data/ads-config.json',token=sessionStorage.getItem('mangagoraw_github_token')||'';let sha='',cfg={version:2,sections:[]};const $=id=>document.getElementById(id);const H=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'});const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));const enc=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=32768)o+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(o)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(){const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path+'?ref=main',{headers:H(),cache:'no-store'});const x=await r.json();if(!r.ok)throw Error(x.message||'Could not load ads');sha=x.sha;cfg=JSON.parse(dec(x.content));cfg.sections=cfg.sections||[]}function render(){if(!cfg.sections.length)cfg.sections=Array.from({length:9},(_,i)=>({id:'ad-'+(i+1),name:'Ad Section '+(i+1),enabled:false,code:'',placement:'start',between:'5'}));$('list').innerHTML=cfg.sections.map((a,i)=>'<div class="ad"><div class="grid"><div><label>Name</label><input class="name" value="'+esc(a.name)+'" style="width:100%"></div><div><label>Placement</label><select class="placement" style="width:100%"><option value="start" '+(a.placement==='start'?'selected':'')+'>Start</option><option value="between" '+(a.placement==='between'?'selected':'')+'>Between Images</option><option value="end" '+(a.placement==='end'?'selected':'')+'>End</option></select></div></div><label><input class="enabled" type="checkbox" '+(a.enabled?'checked':'')+'> Enabled</label><label>Between image number</label><input class="between" value="'+esc(a.between||5)+'" type="number" min="1" max="100"><label>Ad code</label><textarea class="code">'+esc(a.code||'')+'</textarea></div>').join('')}async function load(){if(!token){$('msg').textContent='Connect from Chapters or Manga first.';$('msg').className='err';return}try{await get();render();$('msg').textContent='✓ Loaded.';$('msg').className='ok'}catch(e){$('msg').textContent=e.message;$('msg').className='err'}}$('save').onclick=async()=>{try{const els=[...document.querySelectorAll('.ad')];cfg.version=2;cfg.sections=els.map((e,i)=>({id:'ad-'+(i+1),name:e.querySelector('.name').value.trim()||('Ad Section '+(i+1)),enabled:e.querySelector('.enabled').checked,code:e.querySelector('.code').value,placement:e.querySelector('.placement').value,between:e.querySelector('.between').value}));const r=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:H(),body:JSON.stringify({message:'Update ads configuration',content:enc(JSON.stringify(cfg,null,2)+'\n'),sha,branch:'main'})});const x=await r.json();if(!r.ok)throw Error(x.message||'Save failed');sha=x.content.sha;$('msg').textContent='✓ Saved.';$('msg').className='ok'}catch(e){$('msg').textContent=e.message;$('msg').className='err'}};$('reload').onclick=load;load()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manga Admin | MangaGoRaw</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#101118;border:1px solid #292e39;border-radius:12px;padding:18px;margin:14px 0}label{display:block;color:#aeb3c0;font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#292e39}.muted{color:#aeb3c0;font-size:13px}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.list{display:grid;gap:8px}.item{border:1px solid #292e39;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="/admin/chapters.html">📚 Chapters</a><a href="/admin/ads.html">📢 Ads</a><a href="/">Open site</a></div><h1>📖 Manga</h1><div class="panel"><input id="token" type="password" placeholder="GitHub token" style="width:70%"> <button id="connect">Connect</button><button id="logout" class="secondary">Forget token</button><div id="msg" class="muted"></div></div><main id="app" class="hidden"><div class="panel"><button id="add">＋ Add manga</button></div><div class="panel"><div id="list" class="list"></div></div><div id="editor" class="panel hidden"><div class="row"><div><label>Title</label><input id="title"></div><div><label>Slug</label><input id="slug"></div><div><label>Native title</label><input id="native"></div><div><label>Country</label><select id="country"><option>JP</option><option>US</option><option>FR</option><option>BR</option></select></div></div><label>Cover image</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><div class="actions"><button id="save">Save manga</button><button id="cancel" class="secondary">Cancel</button></div></div></main></div><script>'use strict';const OWNER='MangaGoRaw',REPO='MangaGoRaw.github.io',PATH='data/content.json',BRANCH='main';let token=sessionStorage.getItem('mangagoraw_github_token')||'',data=null,sha='',edit=null;const $=id=>document.getElementById(id);const H=()=>({Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'});function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function enc(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=32768)o+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(o)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(p,o={},tryNo=0){try{const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+p,{...o,headers:{...H(),...(o.headers||{})},cache:'no-store',mode:'cors'});const t=await r.text();if(!r.ok){let d=t;try{d=JSON.parse(t).message||t}catch(e){}if((r.status===409||r.status===429||r.status>=500)&&tryNo<2){await new Promise(x=>setTimeout(x,700*(tryNo+1)));return api(p,o,tryNo+1)}if(r.status===401)throw Error('GitHub 401: token invalid/expired.');if(r.status===403)throw Error('GitHub 403: token lacks permission or rate limit reached. Contents needs Read and write.');if(r.status===404)throw Error('GitHub 404: repository/path not accessible with this token.');throw Error('GitHub '+r.status+': '+String(d).slice(0,500))}return t?JSON.parse(t):{}}catch(e){if(/^GitHub /.test(e.message))throw e;if(tryNo<2){await new Promise(x=>setTimeout(x,700*(tryNo+1)));return api(p,o,tryNo+1)}throw Error('GitHub network error: api.github.com could not be reached from this browser. Check VPN/proxy/DNS/firewall or browser extensions, then retry.')}}async function load(){const x=await api('/contents/'+PATH+'?ref='+BRANCH);sha=x.sha;data=JSON.parse(dec(x.content));data.mangas=data.mangas||[];render()}function render(){$('list').innerHTML=data.mangas.map(m=>'<div class="item"><div><b>'+esc(m.title)+'</b><br><span class="muted">'+esc(m.slug)+' · '+esc(m.country)+'</span></div><button onclick="editManga('+JSON.stringify(m.id)+')">Edit</button></div>').join('')||'<p class="muted">No manga.</p>'}window.editManga=id=>{const m=data.mangas.find(x=>x.id===id);if(!m)return;edit=id;$('title').value=m.title||'';$('slug').value=m.slug||'';$('native').value=m.native_title||'';$('country').value=m.country||'JP';$('editor').classList.remove('hidden')};$('add').onclick=()=>{edit=null;$('title').value='';$('slug').value='';$('native').value='';$('country').value='JP';$('cover').value='';$('editor').classList.remove('hidden')};$('cancel').onclick=()=>$('editor').classList.add('hidden');$('logout').onclick=()=>{sessionStorage.removeItem('mangagoraw_github_token');location.reload()};$('connect').onclick=async()=>{token=$('token').value.trim();if(!token)return;try{await fetch('https://api.github.com/zen',{cache:'no-store',mode:'cors'});await load();sessionStorage.setItem('mangagoraw_github_token',token);$('app').classList.remove('hidden');$('msg').textContent='✓ Connected.'}catch(e){$('msg').textContent=e.message}};$('save').onclick=async()=>{try{const title=$('title').value.trim(),slug=$('slug').value.trim();if(!title||!slug)throw Error('Title and slug are required.');await load();const id=edit||slug.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!id)throw Error('Use a Latin slug.');let m=data.mangas.find(x=>x.id===id);if(edit&&!m)throw Error('Manga not found.');if(!edit){if(data.mangas.some(x=>x.id===id))throw Error('Manga already exists.');m={id,title,slug,native_title:$('native').value.trim(),country:$('country').value,language:$('country').value==='JP'?'ja':'en',cover:'',created_at:new Date().toISOString(),updated_at:new Date().toISOString()};data.mangas.push(m)}else Object.assign(m,{title,slug,native_title:$('native').value.trim(),country:$('country').value,updated_at:new Date().toISOString()});const f=$('cover').files[0];if(f){if(f.size>24*1024*1024)throw Error('Cover exceeds 24 MB.');const path='manga-covers/'+id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]+/g,'_');await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Upload manga cover '+title,content:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)}),branch:BRANCH})});m.cover='/'+path}const x=await api('/contents/'+PATH+'?ref='+BRANCH);await api('/contents/'+PATH,{method:'PUT',body:JSON.stringify({message:(edit?'Update ':'Add ')+title,content:enc(JSON.stringify(data,null,2)+'\n'),sha:x.sha,branch:BRANCH})});$('editor').classList.add('hidden');await load();$('msg').textContent='✓ Manga saved.'}catch(e){$('msg').textContent='Error: '+e.message}};if(token){$('token').value=token;$('connect').click()}</script></body></html>

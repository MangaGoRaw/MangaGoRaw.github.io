<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta id="desc" name="description" content="MangaGoRaw chapter metadata."><link id="canonical" rel="canonical" href="https://mangagoraw.github.io/chapter.html"><title>Manga Chapter | MangaGoRaw</title><style>:root{color-scheme:dark;--bg:#07090e;--panel:#0d1119;--line:#202a39;--muted:#8d98aa;--text:#f5f7fb;--accent:#79a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 400px at 70% 0,#182a49,transparent 60%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}.bar{height:72px;padding:0 5%;border-bottom:1px solid var(--line);background:#090c12e8;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.bar a{color:#aeb7c6}.brand{font-size:22px;font-weight:900}.brand span{color:var(--accent)}.reader{max-width:950px;margin:auto;padding:55px 5% 80px}.box{padding:34px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#111824,#0b0f16);box-shadow:0 20px 60px #0005}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--accent)}h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.045em;margin:12px 0}.meta{color:#9aa6b8}.note{margin:25px 0;padding:16px;border-radius:12px;background:#0a0e15;border:1px solid #1c2635;color:#aeb7c6}.tag{display:inline-block;margin:5px 7px 0 0;padding:9px 12px;border:1px solid #2b3b53;border-radius:999px;color:#a9c8ff;background:#101a29}.tag:hover{border-color:#4a6f9f}.error{color:#ff9aa8}</style></head><body><header class="bar"><a class="brand" href="/"><span>Manga</span>GoRaw</a><a href="/latest-chapters.html">Latest chapters →</a></header><main id="reader" class="reader">Loading…</main><script>const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'');const reader=document.getElementById('reader');function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}Promise.all(['/data/manual-chapters.json','/data/extra-chapters.json'].map(u=>fetch(u).then(r=>r.json()))).then(ds=>{const c=ds.flatMap(d=>d.chapters||[]).find(x=>String(x.slug||'')===slug);if(!c){reader.innerHTML='<div class="box"><div class="eyebrow">404</div><h1>Chapter not found</h1><a class="tag" href="/latest-chapters.html">Browse latest chapters →</a></div>';return}document.title=c.title+' | MangaGoRaw';document.getElementById('canonical').href='https://mangagoraw.github.io/chapter.html?slug='+encodeURIComponent(slug);document.getElementById('desc').content='Chapter '+c.number+' metadata on MangaGoRaw.';reader.innerHTML='<article class="box"><div class="eyebrow">CHAPTER RELEASE</div><h1>'+e(c.title)+'</h1><div class="meta">'+e(c.mangaId)+' · Chapter '+e(c.number)+' · '+e(c.country||'JP')+'</div><div class="note">This public GitHub Pages build currently contains metadata only. Scan pages are not bundled in the public build.</div><a class="tag" href="/latest-chapters.html">← Latest chapters</a><a class="tag" href="/manga.html">Manga directory</a></article>'}).catch(()=>reader.innerHTML='<div class="box"><div class="error">Unable to load chapter metadata.</div></div>');</script></body></html>

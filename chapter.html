ipt></head><body><header class="bar"><a href="/">← MangaGoRaw</a><span id="title" class="title">Chapter</span></header><main id="reader" class="reader">Loading chapter…</main><script>const slug=decodeURIComponent(new URLSearchParams(location.search).get('slug')||'').trim();const raw='https://raw.githubusercontent.com/MangaGoRaw/MangaGoRaw.github.io/main/';const pagesBase='https://mangagoraw.github.io/';function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'})[m])}function normalizePages(p){return(p||[]).map(x=>typeof x==='string'?x:(x?.url||x?.path||x?.src||'')).filter(Boolean).map(x=>{if(!/^https?:\/\//i.test(x))return pagesBase+x.replace(/^\//,'');if(x.startsWith(raw))return x;return x})}function relatedKeywords(c){const title=String(c.title||'').trim();const manga=String(c.manga||c.mangaTitle||title).trim();const n=c.number?String(c.number):'';return[...new Set([title,manga+' chapter '+n,manga+' raw chapter '+n,'read '+manga+' chapter '+n,'manga '+manga+' '+n,'latest '+manga+' chapter'].filter(Boolean))].slice(0,8)}function setSeo(c){const title=String(c.title||'Manga Chapter Raw').trim();const canonical='https://mangagoraw.github.io/chapter.html?slug='+encodeURIComponent(slug);document.title=title+' | MangaGoRaw';document.getElementById('desc').content='Read '+title+' on MangaGoRaw.';document.getElementById('title').textContent=title;var canonicalEl=document.getElementById('canonical');if(!canonicalEl){canonicalEl=document.createElement('link');canonicalEl.id='canonical';canonicalEl.rel='canonical';document.head.appendChild(canonicalEl)}canonicalEl.href=canonical;document.getElementById('ogtitle').content=title+' | MangaGoRaw';document.getElementById('ogdesc').content='Read '+title+' on MangaGoRaw.';document.getElementById('twtitle').content=title+' | MangaGoRaw';document.getElementById('twdesc').content='Read '+title+' on MangaGoRaw.';const ld={"@context":"https://schema.org","@type":"Article","headline":title,"description":"Read "+title+" on MangaGoRaw.","mainEntityOfPage":{"@type":"WebPage","@id":canonical},"url":canonical,"publisher":{"@type":"Organization","name":"MangaGoRaw","url":"https://mangagoraw.github.io/"},"dateModified":c.updatedAt||c.updated_at||c.createdAt||c.created_at||undefined};if(c.pages&&c.pages[0])ld.image=normalizePages(c.pages)[0];document.getElementById('chapter-jsonld').textContent=JSON.stringify(ld)}function render(c){setSeo(c);const r=document.getElementById('reader');const pages=normalizePages(c.pages);if(!pages.length){r.innerHTML='<div class="coming"><h1>'+esc(c.title)+'</h1><p>Chapter metadata is available. Authorized chapter images can be attached from the Admin panel.</p></div>';return}const tags=relatedKeywords(c).map(k=>'<span class="keyword">'+esc(k)+'</span>').join('');r.innerHTML='<div class="pages">'+pages.map((u,i)=>'<img class="page" src="'+esc(u)+'" alt="'+esc(c.title)+'" loading="'+(i<2?'eager':'lazy')+'" decoding="async">').join('')+'</div><section class="related" aria-label="Related chapter searches"><h2>Related manga searches</h2><div class="keywords">'+tags+'</div></section>';if(window.mangaGoRawAnalytics)window.mangaGoRawAnalytics.pageView({chapter_slug:slug,chapter_number:c.number,manga_title:c.manga||c.mangaTitle})}function unwrap(d){if(d&&typeof d.content==='string'){try{return JSON.parse(d.content)}catch(e){}}return d&&typeof d==='object'?d:{}}async function getJson(path){const clean=path.replace(/^\//,'');const r=await fetch(pagesBase+clean+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Unable to load '+clean);return unwrap(await r.json())}function sameSlug(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}async function init(){if(!slug){document.getElementById('reader').innerHTML='<div class="error">Chapter not found.</div>';return}try{const sources=await Promise.all(['data/content.json','data/upcoming-chapters.json','data/manual-chapters.json','data/extra-
